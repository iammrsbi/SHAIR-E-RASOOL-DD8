
name: shair_e_rasool_dd8
description: SHAIR-E-RASOOL DD-8 Digital Delay app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^10.3.7
  just_audio: ^0.10.6
  ffmpeg_kit_flutter_new_audio: ^2.5.8
  path_provider: ^2.1.6
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_concept.png"
  min_sdk_android: 21
